# Longhorn components are privileged (host mounts, block devices) — exempt from
# the cluster-wide baseline PodSecurity profile (see Talos admissionControl).
# Applied by a helmfile presync hook before the chart installs.
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged